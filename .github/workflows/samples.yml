name: Samples

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # Same toolchain as the blocking CI jobs: keep in step with RUST_PINNED in
  # ci.yml.
  RUST_PINNED: "1.99.1"

defaults:
  run:
    shell: bash

jobs:
  samples:
    name: Samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_PINNED }}
        run: |
          rustup toolchain install "$RUST_PINNED" --profile minimal
          rustup default "$RUST_PINNED"
          rustc --version
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Build
        run: cargo build --release --manifest-path tools/check/Cargo.toml
      # ffmpeg writes WAVE_FORMAT_EXTENSIBLE by itself for more than 16 bits
      # and for 5.1. It cannot write RIFX or BW64, so those stay covered by
      # the tests only.
      - name: Generate
        run: |
          dir=$RUNNER_TEMP/generated
          mkdir -p "$dir"
          left="0.6*sin(2*PI*440*t)+0.3*sin(2*PI*3001*t)+0.1*(2*random(0)-1)"
          right="0.5*sin(2*PI*660*t)+0.4*sin(2*PI*5003*t)+0.1*(2*random(1)-1)"
          generate() { # <file> <channel expressions> <output options...>
            local file=$1 exprs=$2
            shift 2
            ffmpeg -nostdin -hide_banner -loglevel error \
              -f lavfi -i "aevalsrc=exprs=$exprs:s=44100:d=3" "$@" "$dir/$file"
          }
          for codec in pcm_u8 pcm_s16le pcm_s24le pcm_s32le pcm_f32le pcm_f64le \
            pcm_alaw pcm_mulaw adpcm_ima_wav adpcm_ms; do
            generate "$codec.wav" "$left|$right" -c:a "$codec"
          done
          generate adpcm_ima_wav-mono-8k.wav "$left" -c:a adpcm_ima_wav -ar 8000
          generate adpcm_ms-mono-8k.wav "$left" -c:a adpcm_ms -ar 8000
          generate pcm_s16le-5.1.wav "$left|$right|$left|0.5*$right|0.5*$left|$right:c=5.1" -c:a pcm_s16le
          generate pcm_s16le-rf64.wav "$left|$right" -c:a pcm_s16le -rf64 always
          generate pcm_s24le.w64 "$left|$right" -c:a pcm_s24le -f w64
          ls -l "$dir"
      - name: Check the generated files
        run: |
          tools/check/target/release/akousma-check --dir "$RUNNER_TEMP/generated" \
            > "$RUNNER_TEMP/generated.md"
      # Downloads the corpus, fails on a wrong SHA-256, then checks it.
      - name: Check the real files
        if: success() || failure()
        run: |
          tools/check/target/release/akousma-check --corpus tools/check/corpus.txt \
            > "$RUNNER_TEMP/real.md"
      - name: Write the summary
        if: success() || failure()
        run: |
          {
            echo "ffmpeg: $(ffmpeg -version | head -1)"
            for part in "generated:Generated by ffmpeg" "real:Real files, pinned by SHA-256"; do
              file=$RUNNER_TEMP/${part%%:*}.md
              echo
              echo "### ${part#*:}"
              echo
              if [ -s "$file" ]; then cat "$file"; else echo "No table: the step failed before it."; fi
              if [ "${part%%:*}" = generated ]; then
                echo
                echo "The ffmpeg encoder writes MS ADPCM with predictor 0 only, so the MS ADPCM rows do not cover the other predictors."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
