name: Benchmarks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # Same toolchain as the blocking CI jobs: keep in step with RUST_PINNED in
  # ci.yml.
  RUST_PINNED: "1.99.1"

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Each value is the median of 100 timed runs, and the seek section times
    # 1000 jumps per run, so the run is minutes long by design.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_PINNED }}
        run: |
          rustup toolchain install "$RUST_PINNED" --profile minimal
          rustup default "$RUST_PINNED"
          rustc --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/benchmarks/target/
          key: ${{ runner.os }}-bench-${{ env.RUST_PINNED }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-bench-${{ env.RUST_PINNED }}-
      # The ffmpeg column appears only when ffmpeg is in PATH, and the Linux
      # image does not ship it; its version is recorded in the report.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Build
        run: cargo build --release --locked --manifest-path tools/benchmarks/Cargo.toml
      - name: Run
        run: cargo run --release --locked --manifest-path tools/benchmarks/Cargo.toml -- --out BENCHMARKS.md
      - name: Write the summary
        run: cat BENCHMARKS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: BENCHMARKS.md
          if-no-files-found: error
