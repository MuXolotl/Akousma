name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [probe, seek, tags]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # A cache entry cannot be overwritten, so every run saves under its own
      # key and the next run restores the newest one by the prefix.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fuzz/corpus/${{ matrix.target }}
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-fuzz-${{ matrix.target }}-
      # The seed count and the corpus size before the run are what the summary
      # compares against, so they are taken before anything is copied in.
      - name: Count the corpus
        id: corpus
        run: |
          echo "count=$(find "tools/fuzz/corpus/$TARGET" -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          echo "seeds=$(find "tools/fuzz/seeds/$TARGET" -type f | wc -l)" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}
      - name: Add the seeds to the corpus
        run: mkdir -p "tools/fuzz/corpus/$TARGET" && cp "tools/fuzz/seeds/$TARGET"/* "tools/fuzz/corpus/$TARGET/"
        env:
          TARGET: ${{ matrix.target }}
      # Five minutes is enough to know a push did not break the parser and
      # far too little to find anything new: libFuzzer needs hours for that.
      - name: Fuzz
        run: cargo +nightly fuzz run "$TARGET" --fuzz-dir tools/fuzz -- -max_total_time="$BUDGET" -timeout=10 -rss_limit_mb=2048
        env:
          TARGET: ${{ matrix.target }}
          BUDGET: ${{ github.event_name == 'schedule' && 3600 || (github.event_name == 'push' && 300 || 1800) }}
      - name: Count the corpus after the run
        id: after
        if: always()
        run: echo "count=$(find "tools/fuzz/corpus/$TARGET" -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}
      - name: Summary
        if: always()
        run: |
          {
            echo "### Fuzz $TARGET"
            echo
            echo "- Trigger: \`$EVENT\`"
            echo "- Budget: $(($BUDGET / 60)) min"
            echo "- Seeds: $SEEDS"
            echo "- Corpus before: $BEFORE files"
            echo "- Corpus after: $AFTER files"
            echo "- Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
          BUDGET: ${{ github.event_name == 'schedule' && 3600 || (github.event_name == 'push' && 300 || 1800) }}
          SEEDS: ${{ steps.corpus.outputs.seeds }}
          BEFORE: ${{ steps.corpus.outputs.count }}
          AFTER: ${{ steps.after.outputs.count }}
          RESULT: ${{ job.status }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: tools/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
