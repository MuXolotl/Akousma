name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [probe, seek, tags]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # A cache entry cannot be overwritten, so every run saves under its own
      # key and the next run restores the newest one by the prefix.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fuzz/corpus/${{ matrix.target }}
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-fuzz-${{ matrix.target }}-
      - name: Add the seeds to the corpus
        run: mkdir -p "tools/fuzz/corpus/$TARGET" && cp "tools/fuzz/seeds/$TARGET"/* "tools/fuzz/corpus/$TARGET/"
        env:
          TARGET: ${{ matrix.target }}
      - name: Fuzz
        run: cargo +nightly fuzz run "$TARGET" --fuzz-dir tools/fuzz -- -max_total_time=300 -timeout=10 -rss_limit_mb=2048
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: tools/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
